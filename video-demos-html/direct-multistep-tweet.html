<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIRECT — multi-step routing (recording)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --green:#86d176; --green-dk:#1a7f37; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:#0a0c10; }
  body{
    display:flex; align-items:center; justify-content:center; min-height:100vh;
    font-family:'Inter',system-ui,sans-serif; color:#fff; padding:32px;
  }

  /* the single recordable card — DIRECT only */
  .card{
    width:min(560px,92vw); background:#0f1217;
    border:1px solid rgba(134,209,118,.5);
    border-radius:16px; overflow:hidden;
    box-shadow:0 10px 40px rgba(134,209,118,.18), 0 4px 18px rgba(0,0,0,.55);
  }
  .head{ padding:20px 24px 16px; }
  .head .task{
    font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;
    font-size:1.6rem; line-height:1.32; font-weight:600; color:#e7ecf2; letter-spacing:-.2px;
  }
  .head .row{ display:flex; align-items:baseline; gap:12px; margin-top:12px; flex-wrap:wrap; }
  .head .m{ font-weight:700; font-size:2.3rem; color:var(--green); letter-spacing:-.3px; }
  .head .s{ font-size:1.28rem; color:#9aa6b2; }

  /* video stage + overlay */
  .stage{ position:relative; background:#000; }
  .crop{ position:relative; width:100%; aspect-ratio:1.32 / 1; overflow:hidden; background:#000; }
  .crop video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }

  /* planning overlay — sits ON the video */
  .plan{
    position:absolute; left:0; right:0; top:0; padding:20px 22px 26px;
    background:linear-gradient(rgba(0,0,0,.78), transparent); display:none;
  }
  .plan.show{ display:block; }
  .plan .lab{
    color:#fff; font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;
    font-size:1.5rem; font-weight:600; margin-bottom:14px; text-shadow:0 1px 4px rgba(0,0,0,.8);
    display:flex; align-items:center; gap:13px;
  }
  .plan.is-think .lab{ color:#ffe3a3; }
  .dot{ width:12px; height:12px; border-radius:50%; background:#8fb3ff; box-shadow:0 0 0 0 rgba(143,179,255,.7); animation:pulse 1.1s infinite; }
  .plan.is-think .dot{ background:#ffce5c; box-shadow:0 0 0 0 rgba(255,206,92,.7); }
  @keyframes pulse{ 70%{ box-shadow:0 0 0 10px rgba(143,179,255,0); } 100%{ box-shadow:0 0 0 0 rgba(143,179,255,0);} }
  .lab .pill{
    margin-left:auto; font-size:1.06rem; letter-spacing:.5px; text-transform:uppercase;
    padding:5px 14px; border-radius:999px; background:rgba(143,179,255,.22); color:#cfe0ff; font-weight:700;
  }
  .plan.is-think .lab .pill{ background:rgba(255,206,92,.22); color:#ffe6a6; }
  .plan .why{
    color:#e9eef4; font-size:1.42rem; line-height:1.38; font-weight:500;
    margin-bottom:14px; text-shadow:0 1px 4px rgba(0,0,0,.85);
  }
  .bar{ height:12px; border-radius:6px; background:rgba(255,255,255,.22); overflow:hidden; }
  .bar > span{ display:block; height:100%; width:0%; border-radius:6px; background:#8fb3ff; }
  .plan.is-think .bar > span{ background:linear-gradient(90deg,#ffce5c,#ffe6a6); }

  /* active-subgoal caption (while the arm moves) */
  .subgoal{
    position:absolute; left:0; right:0; top:0; padding:18px 22px 26px;
    background:linear-gradient(rgba(0,0,0,.74), transparent); color:#fff;
    font-size:1.5rem; font-weight:600; text-shadow:0 1px 4px rgba(0,0,0,.8); display:none;
  }
  .subgoal.show{ display:block; }

  /* end-of-run success tint */
  .result{ position:absolute; inset:0; display:none; box-shadow:inset 0 0 70px rgba(0,0,0,.4); }
  .result.show{ display:block; background:rgba(30,102,48,.24); }

  .foot{
    padding:16px 24px 18px; font-size:1.3rem; color:#c4ccd6;
    border-top:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .foot .tot{ font-family:'JetBrains Mono',ui-monospace,Menlo,monospace; font-weight:700; color:#fff; }
  .foot .ok{ color:var(--green); margin-left:auto; font-weight:700; }
</style>
</head>
<body>
  <div class="card" id="card"
       data-steps='[
         {"si":"put the yellow banana in the white bin","mode":"base","lat":1026,"t0":0,"t1":12.0,"why":"Banana is clearly the heaviest — easy first pick."},
         {"si":"put the green lime in the white bin","mode":"think","lat":19039,"t0":12.0,"t1":32.0,"why":"Lime vs. strawberry are close in weight — reason carefully."},
         {"si":"put the red strawberry in the white bin","mode":"base","lat":477,"t0":32.0,"t1":40.1,"why":"Only the strawberry is left — trivial final pick."}
       ]'>
    <div class="head">
      <div class="task">&ldquo;Place the fruits from heaviest to lightest in the white bin.&rdquo;</div>
    </div>
    <div class="stage">
      <div class="crop">
        <video muted playsinline preload="auto">
          <source src="GOOD_VIDEOS/1_routingmultitaskdrop_run_2026_05_21_10-11-32/video.mp4" type="video/mp4">
        </video>
      </div>
      <div class="plan">
        <div class="lab"><span class="dot"></span><span class="txt">planning…</span><span class="pill">fast</span></div>
        <div class="why"></div>
        <div class="bar"><span></span></div>
      </div>
      <div class="subgoal"></div>
      <div class="result"></div>
    </div>
    <div class="foot">
      <span class="tot">20.5s planning</span> · <span>3 subgoals, 1 routed to think</span>
    </div>
  </div>

<script>
(function(){
  var FAST_WALL=1500, THINK_WALL=4800, RATE=2.0;   // bar duration per mode — snappy on fast, slow on think; label shows TRUE latency
  var card=document.getElementById("card");
  var video=card.querySelector("video");
  var steps=JSON.parse(card.getAttribute("data-steps"));
  var plan=card.querySelector(".plan"),
      bar=card.querySelector(".bar > span"),
      lab=card.querySelector(".lab .txt"),
      pill=card.querySelector(".lab .pill"),
      why=card.querySelector(".plan .why"),
      sg=card.querySelector(".subgoal"),
      resEl=card.querySelector(".result");
  var raf=null, killed=false;

  function planPhase(s){
    return new Promise(function(res){
      try{video.pause();}catch(e){}
      try{video.currentTime=s.t0;}catch(e){}
      var think=s.mode==="think";
      plan.classList.add("show");
      plan.classList.toggle("is-think", think);
      pill.textContent = think ? "think" : "fast";
      why.textContent = s.why || "";
      sg.classList.remove("show");
      var wall=think ? THINK_WALL : FAST_WALL;   // fast bars zip, think bars crawl
      var real=s.lat/1000, start=performance.now();
      (function tick(now){
        if(killed) return;
        var t=Math.min(1,(now-start)/wall);
        bar.style.width=(t*100)+"%";
        lab.textContent=(think?"planner thinking ":"planner ")+(t*real).toFixed(1)+" s";
        if(t<1) raf=requestAnimationFrame(tick); else res();
      })(start);
    });
  }
  function playPhase(s){
    return new Promise(function(res){
      plan.classList.remove("show");
      sg.textContent="▶ "+s.si;
      sg.classList.add("show");
      try{video.currentTime=s.t0;}catch(e){}
      video.playbackRate=RATE;
      var p=video.play(); if(p&&p.catch) p.catch(function(){});
      var done=false, finish=function(){ if(done)return; done=true; try{video.pause();}catch(e){} res(); };
      var cap=setTimeout(finish, ((s.t1-s.t0)/RATE)*1000*3 + 4000);  // generous: don't cut a slow-decoding clip before it finishes
      (function watch(){
        if(killed){ clearTimeout(cap); return; }
        if(video.currentTime>=s.t1-0.05 || video.ended){ clearTimeout(cap); finish(); }
        else raf=requestAnimationFrame(watch);
      })();
    });
  }
  function runOnce(){
    var i=0;
    resEl.classList.remove("show");
    return new Promise(function(resolve){
      (function next(){
        if(killed) return resolve();
        if(i>=steps.length){
          resEl.classList.add("show"); sg.classList.remove("show");
          return resolve();
        }
        var s=steps[i++];
        planPhase(s).then(function(){ if(killed) return resolve(); return playPhase(s); }).then(next);
      })();
    });
  }
  function loop(){ if(killed) return; runOnce().then(function(){ if(!killed) setTimeout(loop, 1600); }); }

  function go(){ loop(); }
  if(/[?&]capture\b/.test(location.search)){
    // deterministic-capture mode: don't auto-run; expose hooks so a recorder drives frames
    window.__demo={ plan:plan, bar:bar, lab:lab, pill:pill, why:why, sg:sg, resEl:resEl, video:video, steps:steps };
  } else if(video.readyState>=1) go();
  else video.addEventListener("loadedmetadata", go, {once:true});
})();
</script>
</body>
</html>
